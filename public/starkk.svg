<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Starkk, l'assistant CRM Lab Learning : réacteur arc pine + menthe -->
  <defs>
    <radialGradient id="fond" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1B3A2E"/>
      <stop offset="100%" stop-color="#0E1B16"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5CD9A0" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#5CD9A0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5CD9A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="50" fill="url(#fond)"/>

  <!-- Halo lumineux du cœur -->
  <circle cx="50" cy="50" r="34" fill="url(#halo)"/>

  <!-- Anneau externe segmenté (bobines du réacteur) -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#205040" stroke-width="7"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#5CD9A0" stroke-width="7"
    stroke-dasharray="9.4 4.7" stroke-linecap="butt" opacity="0.9"
    transform="rotate(-90 50 50)"/>

  <!-- Anneau intermédiaire fin -->
  <circle cx="50" cy="50" r="27" fill="none" stroke="#38C588" stroke-width="1.6" opacity="0.85"/>
  <circle cx="50" cy="50" r="22.5" fill="none" stroke="#5CD9A0" stroke-width="0.9" opacity="0.5"/>

  <!-- Cœur triangulaire (réacteur nouvelle génération) -->
  <polygon points="50,32.5 66,59.5 34,59.5" fill="none" stroke="#5CD9A0" stroke-width="4.5" stroke-linejoin="round"/>
  <polygon points="50,40 59.5,56 40.5,56" fill="#EAFBF3" stroke="#BFF3DC" stroke-width="1" stroke-linejoin="round"/>
</svg>
